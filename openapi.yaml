components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: "bearer"

  parameters:
    integrationSlug:
      name: integration
      in: path
      description: The unique integration slug.
      required: true
      schema:
        type: string
        examples:
          - github-123

    connectedAccountId:
      name: connected_account_id
      in: path
      description: The unique identifier for the connected account.
      required: true
      schema:
        type: string
        examples:
          - user-123

    limit:
      name: limit
      in: query
      description: A limit on the number of objects to be returned.
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
        examples:
          - 20

    order:
      name: order
      in: query
      description: Sort order by the `created_at` timestamp of the objects.
      required: false
      schema:
        type: string
        default: desc
        enum: ["asc", "desc"]
        examples:
          - desc

    after:
      name: after
      in: query
      description: A cursor for use in pagination. `after` is an object ID or slug that defines your place in the list.
      required: false
      schema:
        type: string

    before:
      name: before
      in: query
      description: A cursor for use in pagination. `before` is an object ID or slug that defines your place in the list.
      required: false
      schema:
        type: string

  schemas:
    IntegrationObject:
      type: object
      title: Integration
      description: Represents an integration with a third-party provider.
      properties:
        object:
          description: The object type, which is always `integration`.
          type: string
          enum: ["integration"]
        slug:
          description: The unique slug of the integration.
          type: string
          examples:
            - github-123
        provider:
          description: The unique slug of the provider.
          type: string
          examples:
            - github
        auth_methods:
          description: The authentication methods the integration supports.
          type: array
          items:
            type: string
            enum: [oauth1, oauth2, basic, api_key]
          examples:
            - ["oauth2"]
        is_enabled:
          description: Whether the integration is enabled.
          type: boolean
          examples:
            - true
        logo_url:
          description: The URL of the integration provider's logo.
          type: string
          examples:
            - https://embed-integrations.s3.amazonaws.com/github.svg
        logo_url_dark_mode:
