openapi: 3.0.0
info:
  title: Embed API
  description: You can interact with the Embed API through HTTP requests from any language, or via our official [Node.js](https://github.com/embedhq/embed-node) and [Python](https://github.com/embedhq/embed-python) clients.
  version: "1.0.0"
  contact:
    name: Embed Support
    email: support@useembed.com
security:
  - ApiKeyAuth: []
servers:
  - url: https://api.useembed.com/v1
tags:
  - name: Integrations
    description: Integrate with third-party apps.
  - name: Connected Accounts
    description: Connect end-user accounts to integrations.
  - name: Session Tokens
    description: Short-lived tokens used to connect accounts securely.
  - name: Providers
    description: View integration providers.
  - name: Collections
    description: Store data from apps in collections.
  - name: Syncs
    description: Sync data from apps.
  - name: Queries
    description: Vector and hybrid search across app data.
  - name: Actions
    description: Take actions in apps.
  - name: Proxy
    description: Proxy requests to third-party APIs.
  - name: Webhooks
    description: View and manage webhooks.
paths:
  /integrations:
    post:
      operationId: createIntegration
      tags:
        - Integrations
      summary: Create integration
      description: Creates an integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const integration = await embed.integrations.create({
              provider: "github",
              slug: "github-123",
              oauth_client_id: "1a2b...3c4d",
              oauth_client_secret: "5e6f...7g8h",
            });

            console.log(integration);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            integration = client.integrations.create(
              provider="github",
              slug="github-123",
              oauth_client_id="1a2b...3c4d",
              oauth_client_secret="5e6f...7g8h",
            )

            print(integration)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/integrations \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "provider": "github",
                "slug": "github-123",
                "oauth_client_id": "1a2b...3c4d",
                "oauth_client_secret": "5e6f...7g8h",
              }'
    get:
      operationId: listIntegrations
      tags:
        - Integrations
      summary: List integrations
      description: Returns a list of integrations.
      parameters:
        - name: connected_account_id
          in: query
          description: Filter for integrations associated with a connected account.
          required: false
          schema:
            type: string
        - "$ref": "#/components/parameters/limit"
        - "$ref": "#/components/parameters/order"
        - "$ref": "#/components/parameters/after"
        - "$ref": "#/components/parameters/before"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIntegrationsResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const integrations = await embed.integrations.list();

            console.log(integrations);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            integrations = client.integrations.list()

            print(integrations)

        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/integrations \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /integrations/{integration}:
    get:
      operationId: getIntegration
      tags:
        - Integrations
      summary: Retrieve integration
      description: Returns an integration.
      parameters:
        - "$ref": "#/components/parameters/integrationSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const integration = await embed.integrations.retrieve("github-123");

            console.log(integration);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            integration = client.integrations.retrieve("github-123")

            print(integration)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/integrations/github-123 \
              -H "Authorization: Bearer $EMBED_API_KEY"
    put:
      operationId: updateIntegration
      tags:
        - Integrations
      summary: Update integration
      description: Updates an integration.
      parameters:
        - "$ref": "#/components/parameters/integrationSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntegrationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const integration = await embed.integrations.update("github-123", {
              oauth_client_id: "1a2b...3c4d",
              oauth_client_secret: "5e6f...7g8h",
            });

            console.log(integration);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            integration = client.integrations.update(
              "github-123",
              oauth_client_id="1a2b...3c4d",
              oauth_client_secret="5e6f...7g8h",
            )

            print(integration)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/integrations/github-123 \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "oauth_client_id": "1a2b...3c4d",
                "oauth_client_secret": "5e6f...7g8h",
              }'
    delete:
      operationId: deleteIntegration
      tags:
        - Integrations
      summary: Delete integration
      description: Deletes an integration.
      parameters:
        - "$ref": "#/components/parameters/integrationSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteIntegrationResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const response = await embed.integrations.delete("github-123");

            console.log(response);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            response = client.integrations.delete("github-123")

            print(response)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/integrations/github-123 \
              -X DELETE \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /connected-accounts:
    get:
      operationId: listConnectedAccounts
      tags:
        - Connected Accounts
      summary: List connected accounts
      description: Returns a list of connected accounts.
      parameters:
        - name: integration
          in: query
          description: Filter connected accounts by integration slug.
          required: false
          schema:
            type: string
        - "$ref": "#/components/parameters/limit"
        - "$ref": "#/components/parameters/order"
        - "$ref": "#/components/parameters/after"
        - "$ref": "#/components/parameters/before"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectedAccountsResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const connectedAccounts = await embed.connectedAccounts.list();

            console.log(connectedAccounts);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            connected_accounts = client.connected_accounts.list()

            print(connected_accounts)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/connected-accounts \
              -H "Authorization: Bearer $EMBED_API_KEY"
    post:
      operationId: upsertConnectedAccount
      tags:
        - Connected Accounts
      summary: Upsert connected account
      description: Manually add a connected account. We recommend using the [authentication flow](https://useembed.com/docs/guides/connect-an-account) provided by Embed. However, if you've already obtained account credentials, you can use them to create a connected account with this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertConnectedAccountRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const connectedAccount = await embed.connectedAccounts.upsert({
              id: "user-123",
              integration: "github-123",
              auth_method: "oauth2",
              credentials: {
                "access_token": "...",
                "refresh_token": "...",
                "expires_at": "..."
              }
            });

            console.log(connectedAccount);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            connected_account = client.connected_accounts.upsert(
              id="user-123",
              integration="github-123",
              auth_method="oauth2",
              credentials={
                "access_token": "...",
                "refresh_token": "...",
                "expires_at": "..."
              }
            )

            print(connected_account)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/connected-accounts \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "id": "user-123",
                "integration": "github-123",
                "auth_method": "oauth2",
                "credentials": {
                  "access_token": "...",
                  "refresh_token": "...",
                  "expires_at": "..."
                }
              }'
  /connected-accounts/{connected_account_id}:
    get:
      operationId: getConnectedAccount
      tags:
        - Connected Accounts
      summary: Retrieve connected account
      description: Returns a connected account.
      parameters:
        - "$ref": "#/components/parameters/connectedAccountId"
        - name: integration
          in: query
          description: The slug of the integration to which the connected account belongs.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const connectedAccount = await embed.connectedAccounts.retrieve({
              integration: "github-123"
              connected_account_id: "user-123",
            });

            console.log(connectedAccount);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            connected_account = client.connected_accounts.retrieve(
              integration="github-123"
              connected_account_id="user-123",
            )

            print(connected_account)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/connected-accounts/user-123 \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -d integration=github-123
    put:
      operationId: updateConnectedAccount
      tags:
        - Connected Accounts
      summary: Update connected account
      description: Updates a connected account.
      parameters:
        - "$ref": "#/components/parameters/connectedAccountId"
        - name: integration
          in: query
          description: The slug of the integration to which the connected account belongs.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectedAccountRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const updatedConnectedAccount = await embed.connectedAccounts.update({
              integration: "github-123",
              connected_account_id: "user-123",
              name: "Octocat"
            });

            console.log(updatedConnectedAccount);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            updated_connected_account = client.connected_accounts.update(
              integration="github-123",
              connected_account_id="user-123",
              name="Octocat"
            )

            print(updated_connected_account)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/connected-accounts/user-123?integration=github-123 \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "name": "Octocat" }'
    delete:
      operationId: deleteConnectedAccount
      tags:
        - Connected Accounts
      summary: Delete connected account
      description: Deletes a connected account.
      parameters:
        - "$ref": "#/components/parameters/connectedAccountId"
        - name: integration
          in: query
          description: The slug of the integration to which the connected account belongs.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteConnectedAccountResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const response = await embed.connectedAccounts.delete({
              integration: "github-123"
              connected_account_id: "user-123",
            });

            console.log(response);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            response = client.connected_accounts.delete(
              integration="github-123"
              connected_account_id="user-123",
            )

            print(response)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/connected-accounts/user-123?integration=github-123 \
              -X DELETE \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /session-tokens:
    post:
      operationId: createSessionToken
      tags:
        - Session Tokens
      summary: Create session token
      description: Creates a session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const sessionToken = await embed.sessionTokens.create({
              integration: "github-123",
              connected_account_id: "user-123",
              expires_in_mins: 60,
            });

            console.log(sessionToken);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            session_token = client.session_tokens.create(
              integration="github-123",
              connected_account_id="user-123",
              expires_in_mins=60
            )

            print(session_token)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/session-tokens \
              -H "Authorization: Bearer $EMBED_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "integration": "github-123",
                "connected_account_id": "user-123",
                "expires_in_mins": 60,
              }'
    get:
      operationId: listSessionTokens
      tags:
        - Session Tokens
      summary: List session tokens
      description: Returns a list of session tokens.
      parameters:
        - name: integration
          in: query
          description: Filter for session tokens associated with an integration.
          required: false
          schema:
            type: string
        - name: connected_account_id
          in: query
          description: Filter for session tokens associated with a connected account.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionTokensResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const sessionTokens = await embed.sessionTokens.list();

            console.log(sessionTokens);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            session_tokens = client.session_tokens.list()

            print(session_tokens)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/session-tokens \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /session-tokens/{token}:
    get:
      operationId: getSessionToken
      tags:
        - Session Tokens
      summary: Retrieve session token
      description: Returns a session token.
      parameters:
        - name: token
          in: path
          description: The unique token for the session.
          required: true
          schema:
            type: string
            examples:
              - st_1a2b3c
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const sessionToken = await embed.sessionTokens.retrieve("st_1a2b3c");

            console.log(sessionToken);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            session_token = client.session_tokens.retrieve("st_1a2b3c")

            print(session_token)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/session-tokens/st_1a2b3c \
              -H "Authorization: Bearer $EMBED_API_KEY"
    delete:
      operationId: deleteSessionToken
      tags:
        - Session Tokens
      summary: Delete session token
      description: Deletes a session token.
      parameters:
        - name: token
          in: path
          description: The unique token for the session.
          required: true
          schema:
            type: string
            examples:
              - st_1a2b3c
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionTokenResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const response = await embed.sessionTokens.delete("st_1a2b3c");

            console.log(response);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            response = client.session_tokens.delete("st_1a2b3c")

            print(response)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl https://api.useembed.com/v1/session-tokens/st_1a2b3c \
              -X DELETE \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /providers:
    get:
      operationId: listProviders
      tags:
        - Providers
      summary: List providers
      description: Returns a list of integration providers.
      parameters:
        - name: include_collection_templates
          in: query
          description: Include collection templates for each provider in the response.
          required: false
          schema:
            type: boolean
            examples:
              - false
        - name: include_action_templates
          in: query
          description: Include action templates for each provider in the response.
          required: false
          schema:
            type: boolean
            examples:
              - false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProvidersResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const providers = await embed.providers.list();

            console.log(providers);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            providers = client.providers.list()

            print(providers)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/providers \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /providers/{provider}:
    get:
      operationId: getProvider
      tags:
        - Providers
      summary: Retrieve provider
      description: Returns a provider.
      parameters:
        - name: provider
          in: path
          description: The unique slug of the provider.
          required: true
          schema:
            type: string
            examples:
              - github
        - name: include_collection_templates
          in: query
          description: Include collection templates in the response.
          required: false
          schema:
            type: boolean
            examples:
              - false
        - name: include_action_templates
          in: query
          description: Include action templates in the response.
          required: false
          schema:
            type: boolean
            examples:
              - false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderObject"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const provider = await embed.providers.retrieve("github");

            console.log(provider);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            provider = client.providers.retrieve("github")

            print(provider)
        - lang: "cURL"
          label: "cURL"
          source: |
            curl -G https://api.useembed.com/v1/providers/github \
              -H "Authorization: Bearer $EMBED_API_KEY"
  /providers/{provider}/collection-templates:
    get:
      operationId: getProviderCollectionTemplates
      tags:
        - Providers
      summary: List collection templates
      description: Returns a list of collection templates for a provider.
      parameters:
        - name: provider
          in: path
          description: The unique slug of the provider.
          required: true
          schema:
            type: string
            examples:
              - github
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCollectionTemplatesResponse"
      x-codeSamples:
        - lang: "javascript"
          label: "Node.js"
          source: |
            import Embed from "@embedhq/node";

            const embed = new Embed();

            const collectionTemplates = await embed.providers.collectionTemplates.list("github");

            console.log(collectionTemplates);
        - lang: "python"
          label: "Python"
          source: |
            from embedhq import Embed

            client = Embed()

            collection_templates = client.providers.collection_templates.list("github")

